name: tofu-movies-local
services:
    database:
        image: postgres:16
        environment:
            POSTGRES_USER: demo
            POSTGRES_PASSWORD: local-demo-only
            POSTGRES_DB: tofu_movies
        ports:
            - '127.0.0.1:5199:5432'
        volumes:
            - movies-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U demo -d tofu_movies']
            interval: 2s
            timeout: 3s
            retries: 20
volumes:
    movies-data:
